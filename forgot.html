{% extends "base.html" %}
{% block title %}Forgot password — Threaded{% endblock %}
{% block content %}
<div class="auth-wrap">
  <h2>🔑 Forgot password</h2>
  {% if sent %}
    <p>If an account exists for that email, a reset link is on its way (expires in 1 hour).</p>
    <p><a href="/login">Back to log in</a></p>
  {% else %}
    <form method="post">
      <label>Email</label>
      <input type="email" name="email" required autocomplete="email">
      <button class="btn" type="submit">Send reset link</button>
    </form>
  {% endif %}
</div>
{% endblock %}
