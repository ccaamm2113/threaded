<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings — BTC 15M Kalshi Platform</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        .settings-wrap { max-width: 650px; margin: 40px auto; padding: 24px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; }
        .setting-row { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid rgba(51,65,85,0.4); font-size: 13px; }
        .setting-label { color: var(--text-muted); font-weight: 600; }
        .setting-val { font-weight: 700; color: #fff; }
    </style>
</head>
<body class="terminal-body">
    <header class="terminal-header">
        <div class="header-container">
            <div class="brand-zone">
                <a href="/" class="brand-logo">
                    <span class="btc-badge">₿</span>
                    <span class="brand-name">BTC 15M KALSHI</span>
                </a>
            </div>
            <div class="header-actions">
                <a href="/app" class="btn-refresh">← Return to Terminal</a>
            </div>
        </div>
    </header>

    <div class="settings-wrap">
        <h2 style="font-size:18px;margin-bottom:16px;">Account & Engine Configuration</h2>
        <div class="setting-row">
            <span class="setting-label">Subscription Status</span>
            <span class="setting-val" style="color:#4ade80;">Active — Scalper Pro Plan</span>
        </div>
        <div class="setting-row">
            <span class="setting-label">15M Crawler Frequency</span>
            <span class="setting-val font-mono">15 Seconds (Live Stream)</span>
        </div>
        <div class="setting-row">
            <span class="setting-label">Render Environment</span>
            <span class="setting-val font-mono">render.yaml · Python 3.10</span>
        </div>
        <div class="setting-row">
            <span class="setting-label">Local Timezone Sync</span>
            <span class="setting-val font-mono">UTC & Local Auto-Detect</span>
        </div>
        <div style="margin-top:20px;">
            <a href="/app" class="btn-refresh" style="display:inline-block;text-decoration:none;">Open 15M Live Charts →</a>
        </div>
    </div>
</body>
</html>
