{% extends "base.html" %}
{% block title %}Log in — Threaded{% endblock %}
{% block content %}
<div class="auth-wrap">
  <h2>Welcome back 🧵</h2>
  {% if error %}<div class="auth-err">{{ error }}</div>{% endif %}
  <form method="post">
    <label>Email</label>
    <input type="email" name="email" required autocomplete="email">
    <label>Password</label>
    <input type="password" name="password" required autocomplete="current-password">
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="fine" style="margin-top:14px">No account? <a href="/signup">Get access</a> · <a href="/forgot-password">Forgot password?</a></p>
</div>
{% endblock %}
