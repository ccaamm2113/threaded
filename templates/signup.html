{% extends "base.html" %}
{% block title %}Get access — Threaded{% endblock %}
{% block content %}
<div class="auth-wrap">
  <h2>Get Threaded Pro 🧵</h2>
  <p class="fine">Create your account, then subscribe to unlock the live dashboard.</p>
  {% if error %}<div class="auth-err">{{ error }}</div>{% endif %}
  <form method="post">
    <label>Email</label>
    <input type="email" name="email" required autocomplete="email">
    <label>Password (min 8 characters)</label>
    <input type="password" name="password" required minlength="8" autocomplete="new-password">
    <label>Discord username <span class="fine">(optional — for your Subscriber role)</span></label>
    <input type="text" name="discord_username" placeholder="@you" autocomplete="off">
    <button class="btn" type="submit">Create account</button>
  </form>
  <p class="fine" style="margin-top:14px">Already have one? <a href="/login">Log in</a></p>
</div>
{% endblock %}
