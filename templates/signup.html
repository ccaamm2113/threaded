<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — BTC 15M Kalshi Platform</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        .auth-container { max-width: 400px; margin: 80px auto; padding: 24px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; }
        .auth-title { font-size: 20px; font-weight: 800; margin-bottom: 8px; text-align: center; }
        .auth-desc { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
        .form-input { width: 100%; background: #020617; border: 1px solid var(--border-color); border-radius: 6px; padding: 10px 12px; color: #fff; font-size: 13px; }
        .submit-btn { width: 100%; background: #f59e0b; color: #020617; font-weight: 700; border: none; border-radius: 6px; padding: 12px; font-size: 14px; cursor: pointer; margin-top: 8px; }
        .auth-footer { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 16px; }
        .auth-footer a { color: var(--amber); text-decoration: none; }
    </style>
</head>
<body class="terminal-body">
    <div class="auth-container">
        <h2 class="auth-title">Create Account</h2>
        <p class="auth-desc">Start receiving live 15-minute BTC signals</p>
        <form action="/app" method="get">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-input" placeholder="Alex Trader" required>
            </div>
            <div class="form-group">
                <label class="form-label">Email address</label>
                <input type="email" class="form-input" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">Create Password</label>
                <input type="password" class="form-input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="submit-btn">Create Free Account →</button>
        </form>
        <div class="auth-footer">
            Already have an account? <a href="/login">Log in</a>
        </div>
    </div>
</body>
</html>
