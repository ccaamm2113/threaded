<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Threaded{% endblock %}</title>
<link rel="stylesheet" href="/static/styles.css?v=10">
<style>
.auth-wrap { max-width: 420px; margin: 8vh auto; padding: 28px; background: var(--card);
  border: 1px solid var(--card-border); border-radius: 14px;
  outline: 1px dashed rgba(255,255,255,.13); outline-offset: -6px; }
.auth-wrap h2 { margin-top: 0; }
.auth-wrap label { display: block; margin: 12px 0 4px; color: var(--muted); font-size: .9rem; }
.auth-wrap input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--card-border);
  background: rgba(255,255,255,.05); color: #fff; box-sizing: border-box; }
.auth-wrap .btn { width: 100%; margin-top: 18px; padding: 12px; font-size: 1rem; }
.auth-err { background: rgba(239,68,68,.15); border: 1px solid #ef4444; border-radius: 8px;
  padding: 10px; margin-bottom: 12px; }
.topnav { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px; }
.topnav a { color: #c4b5fd; text-decoration: none; margin-left: 18px; }
.topnav a:hover { text-decoration: underline; }
.brand { font-weight: 800; font-size: 1.3rem;
  background: linear-gradient(90deg, #f0abfc, #818cf8, #67e8f9);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
</style>
</head>
<body>
<video id="bg-video" autoplay muted loop playsinline>
  <source src="/static/img/tokyo_drive_bg.mp4" type="video/mp4">
</video>
<div class="bg-overlay"></div>
<nav class="topnav">
  <a class="brand" href="/">🧵 Threaded</a>
  <div>
    {% if current_user.is_authenticated %}
      <span class="fine">{{ current_user.email }}</span>
      <a href="/app">Dashboard</a>
      <a href="/account">Account</a>
      <a href="/billing">Billing</a>
      {% if is_admin %}<a href="/admin">Admin</a>{% endif %}
      <a href="/logout">Log out</a>
    {% else %}
      <a href="/login">Log in</a>
      <a href="/signup"><b>Get access</b></a>
    {% endif %}
  </div>
</nav>
<main>
{% block content %}{% endblock %}
</main>
<footer>
  <b>🧵 Threaded</b> · Research only, <b>not financial advice</b>.
  <a href="/terms">Terms</a> · <a href="/privacy">Privacy</a>
  <span class="ver-badge">v13 · Starlight</span>
</footer>
</body>
</html>
